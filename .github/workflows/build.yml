name: Build YARP macan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yarp-macan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      YARP_SOURCE_DIR: /build/yarp
      SYNC_JOBS: '8'
      BUILD_JOBS: '2'
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Allocate build storage on the disposable runner
        run: bash scripts/prepare-runner.sh

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 lz4 cpio bc rsync \
            lzop kmod device-tree-compiler libssl-dev libncurses-dev repo
          git config --global user.name 'YARP Build'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          mkdir -p logs dist

      - name: Sync pinned YARP and SM8850 sources
        run: bash scripts/build-yarp.sh sync 2>&1 | tee logs/sync.log

      - name: Build recovery image
        run: |
          bash scripts/resource-report.sh > >(tee logs/resources.log) 2>&1 &
          reporter_pid=$!
          trap 'kill "$reporter_pid" 2>/dev/null || true' EXIT
          sudo systemd-run --scope --unit=yarp-build \
            --property=MemoryHigh=11G --property=MemoryMax=13G \
            --property=MemorySwapMax=12G --property=CPUWeight=50 \
            runuser -u "$(id -un)" -- env \
              YARP_SOURCE_DIR="$YARP_SOURCE_DIR" BUILD_JOBS="$BUILD_JOBS" \
              nice -n 10 bash "$GITHUB_WORKSPACE/scripts/build-yarp.sh" build \
            2>&1 | tee logs/build.log

      - name: Verify and package recovery image
        run: bash scripts/build-yarp.sh package 2>&1 | tee logs/verification.log

      - name: Upload recovery image and source record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: YARP-macan-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Capture final resource diagnostics
        if: always()
        run: |
          mkdir -p logs
          {
            date -u
            free -h
            df -h
            swapon --show
            sudo dmesg --ctime | tail -n 100 || true
          } > logs/final-resources.log 2>&1

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: YARP-build-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
